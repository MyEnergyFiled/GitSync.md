name: Hugo hotbitd Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Native/HugoBridge/**"
      - "scripts/build-hugo-ios.sh"
      - ".github/workflows/hugo-hotbitd.yml"

permissions:
  contents: read

concurrency:
  group: hugo-hotbitd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-site:
    if: ${{ secrets.HOTBITD_READ_TOKEN != '' }}
    name: Build hotbitd with Hugo 0.134.3
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOTBITD_COMMIT: ac24be5

    steps:
      - name: Checkout HugoInk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout hotbitd acceptance site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MyEnergyFiled/hotbitd
          ref: ac24be5
          path: external/hotbitd
          token: ${{ secrets.HOTBITD_READ_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.6"
          cache-dependency-path: Native/HugoBridge/go.mod

      - name: Snapshot hotbitd source
        shell: bash
        run: |
          set -euo pipefail
          find external/hotbitd -type f ! -path 'external/hotbitd/.git/*' \
            -printf '%P\t%s\t%T@\n' | sort > "$RUNNER_TEMP/hotbitd-before.txt"
          git -C external/hotbitd status --porcelain=v1 --ignored > "$RUNNER_TEMP/hotbitd-git-before.txt"

      - name: Build real hotbitd pages with the Hugo façade
        working-directory: Native/HugoBridge
        env:
          HUGO_REAL_SITE: ${{ github.workspace }}/external/hotbitd
          HUGO_REAL_ARTICLE: content/posts/hugo/hugo-app/index.md
        run: go test -vet=off -run '^TestBuildHotbitdRealSite$' -v .

      - name: Verify hotbitd source remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          find external/hotbitd -type f ! -path 'external/hotbitd/.git/*' \
            -printf '%P\t%s\t%T@\n' | sort > "$RUNNER_TEMP/hotbitd-after.txt"
          git -C external/hotbitd status --porcelain=v1 --ignored > "$RUNNER_TEMP/hotbitd-git-after.txt"
          cmp "$RUNNER_TEMP/hotbitd-before.txt" "$RUNNER_TEMP/hotbitd-after.txt"
          cmp "$RUNNER_TEMP/hotbitd-git-before.txt" "$RUNNER_TEMP/hotbitd-git-after.txt"

      - name: Acceptance summary
        if: always()
        run: |
          {
            echo '## hotbitd real-theme acceptance'
            echo ''
            echo '- Hugo: `0.134.3 Standard`'
            echo '- hotbitd commit: `${{ env.HOTBITD_COMMIT }}`'
            echo '- Themes: `PaperMod-PE`, `PaperMod`, `PaperModX`'
            echo '- Source tree: snapshot and Git status compared before/after'
          } >> "$GITHUB_STEP_SUMMARY"
