name: Hugo Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Native/HugoBridge/**"
      - "Sync.md/Models/HugoRuntimeModels.swift"
      - "Sync.md/Services/HugoEmbeddedRuntime.swift"
      - "Sync.md/Services/HugoRuntimeService.swift"
      - "scripts/build-hugo-ios.sh"
      - ".github/workflows/hugo-runtime.yml"

permissions:
  contents: read

concurrency:
  group: hugo-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Hugo 0.134.3 XCFramework and simulator app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODE_PROJECT: Sync.md.xcodeproj
      XCODE_SCHEME: Sync.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.6"
          cache-dependency-path: Native/HugoBridge/go.mod

      - name: Build Hugo runtime XCFramework
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-hugo-ios.sh "$RUNNER_TEMP/HugoRuntime.xcframework"

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          AVAILABLE_DEVICES=$(xcrun simctl list devices available)
          SIMULATOR_UDID=$(printf '%s\n' "$AVAILABLE_DEVICES" | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')
          if [ -z "${SIMULATOR_UDID:-}" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Build app and tests with embedded Hugo runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_FRAMEWORKS="$RUNNER_TEMP/HugoRuntime.xcframework/ios-arm64_x86_64-simulator"
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:SyncMDTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) HUGO_RUNTIME_AVAILABLE' \
            FRAMEWORK_SEARCH_PATHS="$(inherited) $RUNTIME_FRAMEWORKS" \
            OTHER_LDFLAGS="$(inherited) -framework Hugobridge" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run tests with embedded Hugo runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_FRAMEWORKS="$RUNNER_TEMP/HugoRuntime.xcframework/ios-arm64_x86_64-simulator"
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:SyncMDTests \
            -resultBundlePath "$RUNNER_TEMP/HugoRuntimeTests.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) HUGO_RUNTIME_AVAILABLE' \
            FRAMEWORK_SEARCH_PATHS="$(inherited) $RUNTIME_FRAMEWORKS" \
            OTHER_LDFLAGS="$(inherited) -framework Hugobridge" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload runtime and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: HugoRuntime-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/HugoRuntime.xcframework
            ${{ runner.temp }}/HugoRuntime.modules.txt
            ${{ runner.temp }}/HugoRuntimeTests.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Runtime build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Hugo runtime'
            echo ''
            echo '- Hugo: `0.134.3 Standard`'
            echo '- Target: `iOS device + simulator`'
            if [ -d "$RUNNER_TEMP/HugoRuntime.xcframework" ]; then
              echo "- XCFramework size: `$(du -sh "$RUNNER_TEMP/HugoRuntime.xcframework" | cut -f1)`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
