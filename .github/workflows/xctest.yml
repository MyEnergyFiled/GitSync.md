name: XCTest

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: xctest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: SyncMDTests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      XCODE_PROJECT: Sync.md.xcodeproj
      XCODE_SCHEME: Sync.md
      TEST_TARGET: SyncMDTests
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages and build products
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/DerivedData/SourcePackages
            ${{ runner.temp }}/DerivedData/Build
          key: xctest-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            xctest-${{ runner.os }}-${{ runner.arch }}-

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          AVAILABLE_DEVICES=$(xcrun simctl list devices available)
          printf '%s\n' "$AVAILABLE_DEVICES"
          SIMULATOR_UDID=$(printf '%s\n' "$AVAILABLE_DEVICES" | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')
          if [ -z "${SIMULATOR_UDID:-}" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIMULATOR_UDID"

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          time xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Build tests
        shell: bash
        run: |
          set -euo pipefail
          time xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:"$TEST_TARGET" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run unit tests without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          time xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:"$TEST_TARGET" \
            -resultBundlePath "$RUNNER_TEMP/SyncMDTests.xcresult" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SyncMDTests-xcresult-${{ github.run_number }}
          path: ${{ runner.temp }}/SyncMDTests.xcresult
          if-no-files-found: warn
          retention-days: 14
